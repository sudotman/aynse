name: Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, publish, and create release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Inspect release state
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(python scripts/bump_version.py --current)"
          tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject.toml version must use X.Y.Z format (found '$version')"
            exit 1
          fi

          git fetch --force --tags origin

          tag_sha=""
          if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$tag")"
          fi

          pypi_status="$(
            curl --silent --show-error --location \
              --retry 3 --retry-all-errors \
              --output /dev/null --write-out '%{http_code}' \
              "https://pypi.org/pypi/aynse/${version}/json"
          )"
          case "$pypi_status" in
            200) pypi_exists=true ;;
            404) pypi_exists=false ;;
            *)
              echo "::error::PyPI returned HTTP $pypi_status while checking aynse $version"
              exit 1
              ;;
          esac

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi

          if [[ "$pypi_exists" == true && "$release_exists" == true ]]; then
            should_release=false
          else
            should_release=true
          fi

          if [[ "$should_release" == true && -n "$tag_sha" && "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::$tag already points to $tag_sha, not tested commit $RELEASE_SHA"
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "tag_exists=$([[ -n "$tag_sha" ]] && echo true || echo false)"
            echo "pypi_exists=$pypi_exists"
            echo "release_exists=$release_exists"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release inspection"
            echo
            echo "- Version: \`$version\`"
            echo "- PyPI version exists: \`$pypi_exists\`"
            echo "- GitHub Release exists: \`$release_exists\`"
            echo "- Release work required: \`$should_release\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        if: steps.release.outputs.should_release == 'true'
        run: python -m pip install --upgrade build twine

      - name: Build and verify distributions
        if: steps.release.outputs.should_release == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m build --sdist --wheel
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["PACKAGE_VERSION"]
          actual = version("aynse")
          if actual != expected:
              raise SystemExit(f"Built aynse {actual}, expected {expected}")
          PY

      - name: Publish distributions to PyPI
        if: steps.release.outputs.should_release == 'true'
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --skip-existing dist/*

      - name: Create GitHub tag and release
        if: >-
          steps.release.outputs.should_release == 'true' &&
          steps.release.outputs.release_exists == 'false'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "$RELEASE_TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --title "aynse $PACKAGE_VERSION"
            --generate-notes
          )

          if [[ "$TAG_EXISTS" == true ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$RELEASE_SHA")
          fi

          gh release create "${args[@]}"

      - name: Restore missing release artifacts
        if: >-
          steps.release.outputs.should_release == 'true' &&
          steps.release.outputs.release_exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
