name: Tests

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'aynse/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/run-tests.yml'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.dev.txt

    - name: Run deterministic test suite
      run: pytest -m offline -v --tb=short

    - name: Run import tests
      run: |
        python -c "from aynse import stock_df, bhavcopy_save, NSELive, holidays, __version__; print(f'aynse v{__version__} imported successfully')"

  # Live NSE checks are advisory because the upstream service can reject CI
  # traffic or change independently of this package.
  test-network:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.dev.txt

    - name: Run live network smoke tests
      run: pytest -m live -v --tb=short
      continue-on-error: true
